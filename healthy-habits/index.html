<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthy Habits Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Healthy Habits Tracker</h1>
    <nav aria-label="Main"><a href="index.html">Home</a></nav>
  </header>
  <main>
    <h2>Today's habits</h2>
    <p>Log what you did today and see it all in one place.</p>
    <p id="message" role="status"></p>
    <section class="card">
      <h3>Add an entry</h3>
      <form id="entryForm">
        <label for="habit">Habit</label>
        <select id="habit">
          <option value="Water">Water (cups)</option>
          <option value="Sleep">Sleep (hrs)</option>
          <option value="Exercise">Exercise (min)</option>
        </select>
        <label for="amount">Amount</label>
        <input id="amount" type="number" step="0.5" min="0">
        <label for="date">Date</label>
        <input id="date" type="date">
        <button type="submit">Add entry</button>
      </form>
    </section>
    <section class="card">
      <h3>Your entries</h3>
      <div id="filters">
        <button data-filter="All" class="active">All</button>
        <button data-filter="Water">Water</button>
        <button data-filter="Sleep">Sleep</button>
        <button data-filter="Exercise">Exercise</button>
      </div>
      <ul id="entryList"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
